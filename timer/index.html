<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_TIMER // SYSTEM_ACTIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f7ff;
            --neon-pink: #ff0055;
            --dark-bg: #050505;
            --terminal-bg: rgba(0, 20, 20, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Share Tech Mono', monospace;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-cyan);
            overflow: hidden;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
        }

        body::before {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background-image:
                linear-gradient(var(--neon-cyan) 1px, transparent 1px),
                linear-gradient(90deg, var(--neon-cyan) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.05;
            transform: perspective(500px) rotateX(60deg);
            z-index: -1;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            from { transform: perspective(500px) rotateX(60deg) translateY(0); }
            to { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        .main-wrapper {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .scrollable-content::-webkit-scrollbar { width: 8px; }
        .scrollable-content::-webkit-scrollbar-track { background: rgba(0, 247, 255, 0.1); }
        .scrollable-content::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
        }
        .scrollable-content::-webkit-scrollbar-thumb:hover { background: var(--neon-pink); }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--terminal-bg);
            border: 2px solid var(--neon-cyan);
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 247, 255, 0.2), inset 0 0 10px rgba(0, 247, 255, 0.1);
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 95% 100%, 0 100%);
            margin-bottom: 20px;
        }

        .header {
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--neon-cyan);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        #timer {
            font-size: 3.5rem;
            text-align: center;
            margin: 30px 0;
            text-shadow: 0 0 10px var(--neon-cyan);
            animation: glitch 1s infinite alternate-reverse;
            letter-spacing: 2px;
        }

        @keyframes glitch {
            0% { transform: skew(0deg); }
            20% { transform: skew(1deg); }
            21% { transform: skew(-5deg); }
            22% { transform: skew(0deg); }
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            cursor: pointer;
            font-size: 1.2rem;
            text-transform: uppercase;
            transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0% 30%);
            letter-spacing: 2px;
        }

        button:hover {
            background: var(--neon-pink);
            color: white;
            box-shadow: 0 0 20px var(--neon-pink);
        }

        button:active { transform: scale(0.95); }
        button.hidden { display: none; }

        .log-section {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 247, 255, 0.3);
            height: 150px;
            overflow-y: auto;
            padding: 10px;
            font-size: 0.7rem;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-cyan) transparent;
        }

        .log-section::-webkit-scrollbar { width: 6px; }
        .log-section::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 2px; }

        .log-entry {
            margin-bottom: 5px;
            border-left: 2px solid var(--neon-pink);
            padding-left: 10px;
            opacity: 0.8;
        }

        .log-entry span { color: var(--neon-pink); }

        /* Two-column stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
        }

        .stat-box {
            background: rgba(0, 247, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            padding: 15px;
            text-align: center;
            clip-path: polygon(5% 0, 100% 0, 100% 95%, 95% 100%, 0 100%, 0 5%);
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.3s;
        }

        .stat-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 247, 255, 0.2), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Record-beating glow on longest streak box */
        .stat-box.new-record {
            animation: recordPulse 1s ease-in-out infinite;
            border-color: var(--neon-pink);
        }

        @keyframes recordPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 0, 85, 0.3); }
            50% { box-shadow: 0 0 25px rgba(255, 0, 85, 0.9); }
        }

        .stat-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--neon-pink);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.4rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            letter-spacing: 1px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: var(--terminal-bg);
            border: 2px solid var(--neon-cyan);
            padding: 40px 30px;
            max-width: 500px;
            width: 90%;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 95% 100%, 0 100%);
            box-shadow: 0 0 30px rgba(0, 247, 255, 0.4), inset 0 0 20px rgba(0, 247, 255, 0.1);
            animation: modalSlide 0.3s ease-out;
        }

        @keyframes modalSlide {
            from { transform: scale(0.7) translateY(-50px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-header {
            font-size: 1rem;
            letter-spacing: 3px;
            margin-bottom: 20px;
            color: var(--neon-pink);
            text-transform: uppercase;
            text-align: center;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 30px;
        }

        .step {
            width: 30px; height: 30px;
            border: 1px solid var(--neon-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .step.active { background: var(--neon-cyan); color: black; box-shadow: 0 0 15px var(--neon-cyan); }
        .step.completed { background: var(--neon-pink); color: white; border-color: var(--neon-pink); }

        .modal-text {
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
            color: var(--neon-cyan);
            letter-spacing: 1px;
        }

        .modal-buttons { display: flex; gap: 15px; }

        .modal-button {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--neon-cyan);
            background: transparent;
            color: var(--neon-cyan);
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: 0.3s;
            clip-path: polygon(5% 0, 100% 0, 100% 95%, 95% 100%, 0 100%, 0 5%);
        }

        .modal-button:hover { background: var(--neon-cyan); color: black; box-shadow: 0 0 15px var(--neon-cyan); }

        .modal-button.proceed { border-color: var(--neon-pink); color: var(--neon-pink); }
        .modal-button.proceed:hover { background: var(--neon-pink); color: white; box-shadow: 0 0 15px var(--neon-pink); }

        /* Mobile longest streak highlight card */
        .longest-streak-mobile {
            display: none;
        }

        @media (max-width: 768px) {
            .longest-streak-mobile {
                display: block;
                background: linear-gradient(135deg, rgba(255, 0, 85, 0.1), rgba(0, 247, 255, 0.1));
                border: 2px solid var(--neon-pink);
                padding: 25px;
                margin: 20px 0;
                text-align: center;
                clip-path: polygon(0 0, 100% 0, 100% 90%, 95% 100%, 0 100%);
                box-shadow: 0 0 20px rgba(255, 0, 85, 0.3), inset 0 0 10px rgba(255, 0, 85, 0.1);
                animation: streakPulse 2s ease-in-out infinite;
            }

            .streak-label {
                font-size: 0.9rem;
                letter-spacing: 3px;
                color: var(--neon-pink);
                text-transform: uppercase;
                margin-bottom: 15px;
            }

            .streak-value {
                font-size: 2.5rem;
                color: var(--neon-pink);
                text-shadow: 0 0 20px var(--neon-pink);
                letter-spacing: 2px;
                font-weight: bold;
            }

            @keyframes streakPulse {
                0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 85, 0.3), inset 0 0 10px rgba(255, 0, 85, 0.1); }
                50% { box-shadow: 0 0 30px rgba(255, 0, 85, 0.6), inset 0 0 15px rgba(255, 0, 85, 0.2); }
            }

            #timer { font-size: 2.5rem; }
            .container { padding: 20px; }
            button { font-size: 1rem; padding: 12px; }
            .stats-grid { grid-template-columns: 1fr; gap: 10px; }
        }

        @media (max-width: 480px) {
            #timer { font-size: 1.8rem; margin: 20px 0; }
            .container { padding: 15px; margin-bottom: 15px; }
            .header { font-size: 0.7rem; }
            button { font-size: 0.9rem; padding: 10px; }
            .controls { gap: 10px; }
            .stat-value { font-size: 1.1rem; }
            .streak-value { font-size: 2rem; }
            .modal-content { padding: 25px 20px; }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="scrollable-content">
        <div class="container">
            <div class="header">
                <span>STATUS: ONLINE</span>
                <span>SYS_LOG_PERSIST_V.2.0</span>
            </div>

            <div id="timer">00:00:00:00</div>

            <div class="controls">
                <button id="startBtn" onclick="startTimer()">Start</button>
                <button id="resetBtn" class="hidden" onclick="openResetConfirmation()" style="border-color: var(--neon-cyan); color: var(--neon-cyan);">Reset</button>
            </div>

            <!-- Longest Streak Mobile Only -->
            <div class="longest-streak-mobile">
                <div class="streak-label">⚡ Longest Time Streak ⚡</div>
                <div class="streak-value" id="longestStreakMobile">0 DAYS</div>
            </div>

            <!-- Stats Section: only Current Streak + Longest Streak -->
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Current Streak</div>
                    <div class="stat-value" id="currentStreak">00:00:00:00</div>
                </div>
                <div class="stat-box" id="longestStreakBox">
                    <div class="stat-label">Longest Streak</div>
                    <div class="stat-value" id="longestStreak">00:00:00:00</div>
                </div>
            </div>

            <div class="header" style="border-bottom: none; border-top: 1px solid var(--neon-cyan); padding-top: 5px;">
                <span>SYSTEM_LOGS</span>
            </div>
            <div class="log-section" id="logs">
                <div class="log-entry">INITIALIZING...</div>
            </div>
        </div>
    </div>
</div>

<!-- Reset Confirmation Modal -->
<div id="resetModal" class="modal">
    <div class="modal-content">
        <div class="modal-header" id="modalTitle">RESET CURRENT TIMER?</div>

        <div class="step-indicator">
            <div class="step active" id="step1">1</div>
            <div class="step" id="step2">2</div>
            <div class="step" id="step3">3</div>
        </div>

        <div class="modal-text" id="modalText">
            This will reset the current timer to zero. Your Longest Streak will be preserved.
        </div>

        <div class="modal-buttons">
            <button class="modal-button" onclick="closeResetConfirmation()">Cancel</button>
            <button class="modal-button proceed" onclick="proceedReset()" id="proceedBtn">Proceed</button>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const REDIS_URL = "https://eminent-bulldog-76184.upstash.io";
    const REDIS_TOKEN = "gQAAAAAAASmYAAIgcDEwZWMyMzZhOTY3ZmE0ODY2OGU4ODcxMGZhZTUzOTgwYw";

    // Runtime state
    let startTime = null;
    let isRunning = false;
    let intervalId = null;

    // Streak state
    let longestStreakMs = 0;
    let hasStartedBefore = false;
    let recordReachedInCurrentRun = false;

    let resetStep = 0;

    const ONE_DAY_MS = 86400000;

    const resetMessages = [
        { title: "RESET CURRENT TIMER?", text: "This will reset the current timer to zero. Your Longest Streak will be preserved." },
        { title: "WARNING: CURRENT RUN WILL BE LOST", text: "The active session will be cleared. Longest Streak stays intact. Are you sure?" },
        { title: "FINAL CONFIRMATION", text: "Click PROCEED to confirm timer reset. Longest Streak will not be affected." }
    ];

    // ---- Redis helpers ----
    async function api(cmd, ...args) {
        try {
            const response = await fetch(`${REDIS_URL}/${cmd}/${args.join('/')}`, {
                headers: { Authorization: `Bearer ${REDIS_TOKEN}` }
            });
            return response.json();
        } catch (e) {
            console.error('Redis error:', e);
            return { result: null };
        }
    }

    // ---- Formatters ----
    function formatTime(ms) {
        let totalSecs = Math.floor(ms / 1000);
        let days = Math.floor(totalSecs / 86400);
        let hrs = Math.floor((totalSecs % 86400) / 3600);
        let mins = Math.floor((totalSecs % 3600) / 60);
        let secs = totalSecs % 60;
        return `${String(days).padStart(2, '0')}:${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function formatDays(ms) {
        let days = Math.floor(ms / 86400000);
        // Show at least 1 DAY if we have any ms (i.e. has started before)
        if (hasStartedBefore && days < 1) days = 1;
        return days === 1 ? `${days} DAY` : `${days} DAYS`;
    }

    function currentElapsed() {
        if (!isRunning || !startTime) return 0;
        return Date.now() - startTime;
    }

    // Throttle streak persistence — once per minute max (vs every second = ~1380 fewer writes/day)
    let lastStreakPersistTime = 0;
    const STREAK_PERSIST_INTERVAL = 60000;

    // ---- UI update on every tick ----
    function tick() {
        const elapsed = currentElapsed();
        document.getElementById('timer').innerText = formatTime(elapsed);
        document.getElementById('currentStreak').innerText = formatTime(elapsed);

        // Update Longest Streak only when current run beats it
        if (elapsed > longestStreakMs) {
            longestStreakMs = elapsed;
            updateLongestStreakUI(true);

            // Throttle writes: persist at most once per minute
            const now = Date.now();
            if (now - lastStreakPersistTime > STREAK_PERSIST_INTERVAL) {
                lastStreakPersistTime = now;
                persistStreakStats();
            }

            // Log new record once per run
            if (!recordReachedInCurrentRun) {
                recordReachedInCurrentRun = true;
                addLogEntry('NEW_LONGEST_STREAK_REACHED');
            }
        }
    }

    // ---- Keepalive: silent PING every 6 hours to prevent Upstash inactivity deletion ----
    // Free tier deletes DBs idle for 7 days. 4 pings/day costs 4 requests and keeps it alive forever.
    async function keepalive() {
        try { await api('PING'); } catch(e) {}
    }
    setInterval(keepalive, 6 * 60 * 60 * 1000);

    function updateLongestStreakUI(isNewRecord) {
        document.getElementById('longestStreak').innerText = formatTime(longestStreakMs);
        document.getElementById('longestStreakMobile').innerText = formatDays(longestStreakMs);

        const box = document.getElementById('longestStreakBox');
        if (isNewRecord) {
            box.classList.add('new-record');
        } else {
            box.classList.remove('new-record');
        }
    }

    // ---- Persist to Redis ----
    async function persistTimerState() {
        const state = { startTime, isRunning };
        await api('SET', 'timer_state_v2', encodeURIComponent(JSON.stringify(state)));
    }

    async function persistStreakStats() {
        const stats = {
            longestStreakMs,
            hasStartedBefore
        };
        await api('SET', 'timer_stats_v2', encodeURIComponent(JSON.stringify(stats)));
    }

    async function addLogEntry(msg) {
        const timestamp = new Date().toLocaleString();
        const logMsg = `<span>[${timestamp}]</span> ${msg}`;
        await api('LPUSH', 'timer_logs', encodeURIComponent(logMsg));
        prependLog(logMsg);
    }

    function prependLog(html) {
        const container = document.getElementById('logs');
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.innerHTML = decodeURIComponent(html.startsWith('%') ? html : encodeURIComponent(html).replace(/%3C/gi,'<').replace(/%3E/gi,'>'));
        // Just set innerHTML directly since we control the string
        div.innerHTML = html;
        container.insertBefore(div, container.firstChild);
    }

    // ---- Button states ----
    function updateUI() {
        document.getElementById('startBtn').classList.toggle('hidden', isRunning);
        document.getElementById('resetBtn').classList.toggle('hidden', !isRunning);
    }

    // ---- Timer actions ----
    async function startTimer() {
        if (isRunning) return;

        // First-ever start: seed longest streak to 1 day
        if (!hasStartedBefore) {
            hasStartedBefore = true;
            longestStreakMs = ONE_DAY_MS;
            updateLongestStreakUI(false);
            await persistStreakStats();
        }

        startTime = Date.now();
        isRunning = true;
        recordReachedInCurrentRun = false;

        await persistTimerState();
        await addLogEntry('TIMER_STARTED');

        updateUI();
        startLocalTimer();
    }

    function startLocalTimer() {
        if (intervalId) clearInterval(intervalId);
        intervalId = setInterval(tick, 1000);
    }

    // ---- Reset flow ----
    function openResetConfirmation() {
        resetStep = 0;
        updateResetModal();
        document.getElementById('resetModal').classList.add('show');
    }

    function closeResetConfirmation() {
        document.getElementById('resetModal').classList.remove('show');
        resetStep = 0;
    }

    function updateResetModal() {
        const modal = resetMessages[resetStep];
        document.getElementById('modalTitle').innerText = modal.title;
        document.getElementById('modalText').innerText = modal.text;

        for (let i = 0; i < 3; i++) {
            const step = document.getElementById(`step${i + 1}`);
            if (i < resetStep) {
                step.classList.add('completed');
                step.classList.remove('active');
            } else if (i === resetStep) {
                step.classList.add('active');
                step.classList.remove('completed');
            } else {
                step.classList.remove('active', 'completed');
            }
        }
    }

    async function proceedReset() {
        resetStep++;
        if (resetStep < 3) {
            updateResetModal();
        } else {
            await executeReset();
            closeResetConfirmation();
        }
    }

    async function executeReset() {
        clearInterval(intervalId);
        startTime = null;
        isRunning = false;
        recordReachedInCurrentRun = false;

        document.getElementById('timer').innerText = "00:00:00:00";
        document.getElementById('currentStreak').innerText = "00:00:00:00";
        updateLongestStreakUI(false);

        await persistTimerState();
        await addLogEntry('TIMER_RESET_BY_USER');

        updateUI();
    }

    // ---- Sync from Redis on load ----
    async function sync() {
        const [stateRes, statsRes, logsRes] = await Promise.all([
            api('GET', 'timer_state_v2'),
            api('GET', 'timer_stats_v2'),
            api('LRANGE', 'timer_logs', '0', '-1')
        ]);

        // Restore streak stats
        if (statsRes.result) {
            try {
                const stats = JSON.parse(decodeURIComponent(statsRes.result));
                longestStreakMs = stats.longestStreakMs || 0;
                hasStartedBefore = stats.hasStartedBefore || false;
            } catch(e) {}
        }

        // Restore timer state
        if (stateRes.result) {
            try {
                const state = JSON.parse(decodeURIComponent(stateRes.result));
                startTime = state.startTime;
                isRunning = state.isRunning || false;

                if (isRunning && startTime) {
                    startLocalTimer();
                } else {
                    document.getElementById('timer').innerText = "00:00:00:00";
                    document.getElementById('currentStreak').innerText = "00:00:00:00";
                }
            } catch(e) {}
        }

        // Restore logs
        const logContainer = document.getElementById('logs');
        logContainer.innerHTML = '';
        if (logsRes.result && logsRes.result.length) {
            logsRes.result.forEach(log => {
                const div = document.createElement('div');
                div.className = 'log-entry';
                div.innerHTML = decodeURIComponent(log);
                logContainer.appendChild(div);
            });
        } else {
            logContainer.innerHTML = '<div class="log-entry">INITIALIZING...</div>';
        }

        updateLongestStreakUI(false);
        updateUI();
    }

    // Initialize
    sync();
</script>
</body>
</html>
